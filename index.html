<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> WEBSITE CRACK DATA NIK </title>

    <!-- ===== CSS ===== -->
    <link rel="stylesheet" href="css/style.css" />

    <!-- ===== FONT AWESOME ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

    <div class="container">

        <!-- ============================================================
        HEADER
        ============================================================ -->
        <div class="header">
            <div class="header-icon">
                <i class="fas fa-id-card"></i>
            </div>
            <div>
                <div class="header-title">
                    Cek NIK
                    <span class="header-badge">KTP</span>
                </div>
                <div class="header-sub">
                    <i class="fas fa-shield-alt"></i> Data sesuai sumber resmi
                </div>
            </div>
        </div>

        <!-- ============================================================
        FORM
        ============================================================ -->
        <div class="form-box">
            <div class="form-row">
                <label class="form-label">
                    <i class="fas fa-search"></i> NIK
                </label>
                <input type="text" id="nikInput" class="form-input" placeholder="Masukkan 16 digit NIK" maxlength="16" />
                <button id="cekBtn" class="btn-cek">
                    <i class="fas fa-chevron-circle-right"></i> Cek
                </button>
            </div>
            <div class="form-info">
                <i class="fas fa-info-circle"></i> Contoh: 3271010101010001
            </div>
        </div>

        <!-- ============================================================
        HASIL
        ============================================================ -->
        <div id="resultBox" class="result-box">

            <div class="result-header">
                <i class="fas fa-check-circle"></i>
                <h2>📋 DATA KTP DARI NIK</h2>
            </div>

            <div class="result-body">
                <div class="data-grid" id="dataGrid">
                    <!-- diisi oleh JS -->
                </div>
            </div>

            <div class="result-footer">
                <div class="info">
                    <i class="fas fa-database"></i>
                    <span id="fileInfo">Hasil juga disimpan di: nik_result_XXXX.txt</span>
                </div>
                <button id="simpanBtn" class="btn-simpan">
                    <i class="fas fa-download"></i> Simpan .txt
                </button>
            </div>
        </div>

    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script src="js/function.js"></script>

</body>
</html>
